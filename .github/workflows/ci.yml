# CI del SDK de C# (docs/api/43 §2.13). Escrita, NO activa: se activa sola cuando este directorio sea su propio repo (trevol-dotnet).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    env:
      TREVOL_API_KEY: tvl_test_a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.dotnet }}
      - name: Compilar los dos destinos (netstandard2.0 y net8.0) y revisar el formato
        run: dotnet build src/Trevol -c Release --nologo
      - run: dotnet test pruebas/Trevol.Pruebas --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contra Prism (servidor simulado desde la especificación pública) y los fragmentos de la documentación
        run: |
          npx --yes @stoplight/prism-cli@5.16.0 mock pruebas/datos/openapi.json -p 4010 -h 127.0.0.1 > /tmp/prism.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4010/health && break; sleep 1; done
          TREVOL_PRISM_URL=http://127.0.0.1:4010 dotnet test pruebas/Trevol.Pruebas --nologo
      - name: El paquete se arma
        run: dotnet pack src/Trevol -c Release --nologo -o paquete
